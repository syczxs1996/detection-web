<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>产线规划 · 织鉴</title>
<meta name="description" content="画出你的厂房：门、承重柱、障碍物、通道，再把验布机、包装机、输送带拖进来摆放，自动检查碰撞和遮挡。">
<link rel="stylesheet" href="assets/site.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:grid;grid-template-columns:58px minmax(0,1fr) 340px}

/* 左侧工具条 */
.tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;z-index:5}
.tools button{width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;position:relative;padding:0}
.tools button svg{width:22px;height:22px}
.tools button:hover{color:var(--fg);background:var(--panel-2)}
.tools button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tools button .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--ink-fg);font-size:12px;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.tools button:hover .tip{opacity:1}
.tools button .tip kbd{font-family:var(--f-mono);opacity:.7;margin-left:6px}
.tools hr{width:28px;border:0;border-top:1px solid var(--line);margin:6px 0}

/* 画布 */
#stage{position:relative;background:var(--stage);min-width:0;overflow:hidden}
#stage>canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.topbar>*{pointer-events:auto}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;box-shadow:0 2px 8px rgba(10,20,30,.06)}
.seg button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--fg);padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button:hover{background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button:disabled{opacity:.35;cursor:default;background:none}
.spacer{flex:1}

.toolopt{position:absolute;top:58px;left:12px;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px;box-shadow:0 10px 28px rgba(10,20,30,.12)}
.toolopt[hidden]{display:none}
.toolopt h4{margin:0 0 6px;font-size:14px}
.toolopt p{margin:0 0 8px;color:var(--muted);font-size:12.5px;line-height:1.55}
.toolopt .sep{border-top:1px solid var(--line);margin:12px 0 10px}
.f{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.f>label{color:var(--muted);min-width:56px;font-size:12.5px}
.f input[type=number],.f input[type=text],.f select{flex:1;min-width:0;width:100%;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.f .u{color:var(--muted);font-size:12px;min-width:16px}
.f input[type=checkbox]{accent-color:var(--accent);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row2 .f>label{min-width:0}
.mini{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--accent)}
.mini.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.mini.danger{color:var(--danger)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}

.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);font-size:12.5px;padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;opacity:.93;max-width:calc(100% - 200px);overflow:hidden;text-overflow:ellipsis}
.hint kbd{font-family:var(--f-mono);background:rgba(255,255,255,.16);border-radius:4px;padding:0 5px;margin:0 2px;font-size:11.5px}
.hint b{color:#ffd28a}
.status{position:absolute;right:12px;bottom:14px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;pointer-events:none}
.legend{position:absolute;left:12px;bottom:14px;display:flex;gap:10px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;pointer-events:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;font-size:11.5px;white-space:nowrap;transform:translate(-50%,-50%);padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);color:var(--fg)}
.lbl.m{font-weight:600}
#labels.plan .lbl{font-size:10.5px;padding:0 4px;opacity:.88}
#labels.plan .lbl.m{background:color-mix(in srgb,var(--panel) 70%,transparent)}
.lbl.err{background:var(--danger);color:#fff;border-color:var(--danger)}
.lbl.warn{background:var(--signal);color:#1b1206;border-color:var(--signal)}
.lbl.dim{background:none;border:0;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.lbl.live{background:var(--ink);color:var(--ink-fg);border:0;font-family:var(--f-mono)}
.lbl.door{background:#2e9a5a;color:#fff;border-color:#2e9a5a;font-size:11px}
.lbl.obs{background:#d9822b;color:#fff;border-color:#d9822b;font-size:11px}
.lbl.aisle{background:#d4b106;color:#1b1606;border-color:#d4b106;font-size:11px}

/* 右侧面板 */
aside{background:var(--panel);border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;font:inherit;font-size:13.5px;padding:12px 0;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font-size:11px;line-height:18px;background:var(--danger);color:#fff;margin-left:4px;font-weight:600}
.badge.warn{background:var(--signal);color:#1b1206}
.badge.ok{background:var(--accent-2)}
.pane{display:none;overflow-y:auto;flex:1;padding:14px 16px;min-height:0}
.pane.on{display:block}
.pane h5{margin:14px 0 8px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.pane h5:first-child{margin-top:0}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card-m{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:5px 5px 8px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;position:relative}
.card-m:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.card-m canvas{display:block;width:100%;aspect-ratio:16/11;border-radius:6px;background:var(--panel-2)}
.card-m b{display:block;font-size:12.5px;margin:6px 4px 0;line-height:1.3}
.card-m small{display:block;font-size:10.5px;color:var(--muted);margin:2px 4px 0;font-family:var(--f-mono)}
.card-m .bd{position:absolute;top:9px;left:9px;font-size:10.5px;background:var(--accent-2);color:#fff;border-radius:4px;padding:0 5px}
.card-m.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.sum{list-style:none;margin:0;padding:0;font-size:13px}
.sum li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.sum li b{font-family:var(--f-mono)}
.sum li.tot{border-bottom:0;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;line-height:1.6;padding:6px 0}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues li{font-size:13px;line-height:1.5;padding:8px 10px;border-radius:8px;border-left:3px solid var(--danger);background:color-mix(in srgb,var(--danger) 9%,transparent);cursor:pointer}
.issues li.warn{border-left-color:var(--signal);background:color-mix(in srgb,var(--signal) 12%,transparent)}
.issues li b{font-weight:600}
.issues li small{display:block;color:var(--muted);font-size:11.5px}
.okbox{padding:16px;border-radius:10px;background:color-mix(in srgb,var(--accent-2) 12%,transparent);color:var(--fg);font-size:13.5px;line-height:1.6}
.okbox b{color:var(--accent-2)}
.props .ttl{font-size:16px;font-weight:700;margin:0 0 2px}
.props .sub{color:var(--muted);font-size:12px;margin:0 0 6px;font-family:var(--f-mono)}
.foot{flex:none;padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.foot .btn{flex:1;padding:9px 10px;font-size:13px}
.btn-line{border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ink-fg);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
#ghostCard{position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:var(--ink-fg);font-size:12px;padding:4px 10px;border-radius:6px;transform:translate(12px,12px);display:none}

@media (max-width:900px){
  html,body{overflow:auto;height:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto 62vh auto}
  .tools{flex-direction:row;justify-content:center;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .tools hr{display:none}
  .tools button .tip{display:none}
  aside{border-left:0;border-top:1px solid var(--line);min-height:60vh}
  .toolopt{width:auto;right:12px}
  .hint{max-width:calc(100% - 24px);bottom:48px}
  .legend{display:none}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="wrap" style="max-width:none">
    <a class="brand" href="index.html"><span class="brand-mark"></span>织鉴<small>AI 验布系统</small></a>
    <div class="nav-links"><a href="index.html">产品介绍</a><a href="configurator.html">在线选配</a><a href="layout.html" aria-current="page">产线规划</a></div>
    <button class="theme-toggle" id="themeBtn" aria-label="切换深浅色">◐</button>

<main class="app">
  <nav class="tools" id="tools" aria-label="绘图工具"></nav>

  <div id="stage">
    <div id="labels"></div>
    <div class="topbar">
      <div class="seg" role="group" aria-label="视图"><button data-view="plan">平面图</button><button data-view="3d">3D</button></div>
      <div class="seg"><button id="bUndo" title="撤销 Ctrl+Z">↶ 撤销</button><button id="bRedo" title="重做 Ctrl+Y">↷ 重做</button></div>
      <div class="seg"><button id="bFit" title="F">⤢ 全景</button><button id="bWall">墙体：剖切</button><button id="bLbl" aria-pressed="true">标注</button></div>
      <span class="spacer"></span>
      <div class="seg"><button id="bDemo">载入示例</button><button id="bClear">清空</button><button id="bPng">导出图片</button><button id="bSave">保存方案</button><button id="bOpen">打开方案</button></div>
    </div>
    <div class="toolopt" id="toolopt" hidden></div>
    <div class="legend"><span><i style="background:#2f80d0;opacity:.5"></i>操作区</span><span><i style="background:#2e9a5a"></i>门口留空</span><span><i style="background:#d4b106"></i>通道</span><span><i style="background:#e5484d"></i>冲突</span></div>
    <div class="hint" id="hint"></div>
    <div class="status" id="status">—</div>
  </div>

  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="lib" aria-selected="true">设备库</button>
      <button role="tab" data-tab="props" aria-selected="false">属性</button>
      <button role="tab" data-tab="check" aria-selected="false">检查<span class="badge ok" id="badge">✓</span></button>
    </div>
    <div class="pane on" data-pane="lib">
      <h5>拖到厂房里摆放</h5>
      <div class="lib" id="lib"></div>
      <h5>已摆放</h5>
      <ul class="sum" id="sum"></ul>
    </div>
    <div class="pane props" data-pane="props" id="props"></div>
    <div class="pane" data-pane="check"><div id="check"></div></div>
    <div class="foot"><button class="btn btn-line" id="bHelp">使用说明</button><button class="btn btn-primary" id="bSubmit">按此方案咨询</button></div>
  </aside>
</main>
<div id="ghostCard"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';
const T=THREE, $=id=>document.getElementById(id);
const rad=d=>d*Math.PI/180;
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtM=mm=>(mm/1000).toFixed(mm%1000===0?0:1)+' m';
addEventListener('error',e=>{ document.body.dataset.err=(e.message||'')+' @'+(e.lineno||''); });

// ================================================================
// 材质与几何小工具（单位 mm，y 向上；机器本地坐标 x=长度方向，z=深度方向，+z 为操作面）
// ================================================================
// 色值按 sRGB 书写，转成线性再交给渲染器（输出是 sRGB），否则颜色会整体发白
function std(c,m,r,extra){ const mat=new T.MeshStandardMaterial(Object.assign({color:c,metalness:m==null?.3:m,roughness:r==null?.55:r},extra||{}));
  mat.color.convertSRGBToLinear(); if(extra&&extra.emissive) mat.emissive.convertSRGBToLinear(); if(mat.map) mat.map.encoding=T.sRGBEncoding; return mat; }
function gridTex(){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  g.strokeStyle='#8f99a3'; g.lineWidth=5; for(let i=0;i<=64;i+=16){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,64); g.stroke(); g.beginPath(); g.moveTo(0,i); g.lineTo(64,i); g.stroke(); }
  const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; return t; }
function stripeTex(){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  g.fillStyle='rgba(240,200,40,.28)'; g.fillRect(0,0,64,64); g.strokeStyle='rgba(225,180,20,.75)'; g.lineWidth=10;
  for(let i=-64;i<=128;i+=32){ g.beginPath(); g.moveTo(i,64); g.lineTo(i+64,0); g.stroke(); }
  const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; return t; }
const M={
  white:std(0xe9ecf0,.15,.55), gray:std(0xbfc5cc,.45,.45), blue:std(0x4c5ccc,.2,.45), dark:std(0x2b2e33,.3,.6), black:std(0x141619,.2,.7),
  steel:std(0xc6ccd3,.85,.25), alu:std(0xc9cfd5,.6,.38), belt:std(0x2e3a33,.1,.85), green:std(0x3f9b63,.1,.6), pink:std(0xc96a7c,.25,.5),
  roll:std(0xe7dcc4,0,.9), roll2:std(0x5b6f96,0,.9), roll3:std(0x9a4d55,0,.9), lamp:std(0xfff4d6,0,.6,{emissive:0xffe6a8,emissiveIntensity:.9}),
  fabric:std(0x5f7396,0,.9,{side:T.DoubleSide}), cage:std(0x9aa3ad,.6,.4,{transparent:true,opacity:.4,depthWrite:false}),
  mesh:std(0x8f99a3,.5,.5,{map:gridTex(),transparent:true,alphaTest:.3,side:T.DoubleSide}), accent:std(0x0f8f86,.3,.5),
  concrete:std(0xeef0f2,0,.95,{polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:2}), floor:std(0xc8ccd1,0,.9,{map:tileTex()}), ground:std(0xd5dade,0,1),
  wallS:std(0xf6f7f8,0,.95,{polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:2}), wallCap:std(0xffffff,0,1,{polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:2}), wallPlan:std(0x5d6670,0,.9,{polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:2}),
  doorLeaf:std(0xb7bcc2,.1,.6), doorFrame:std(0x8d939a,.2,.55), gateLeaf:std(0xc3c8ce,.3,.5,{map:slatTex()}),
  wall:std(0xd8dde2,0,.9,{transparent:true,opacity:.92}), wallT:std(0xd8dde2,0,.9,{transparent:true,opacity:.22,depthWrite:false}),
  obs:std(0xe08a2c,.1,.7,{transparent:true,opacity:.62,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:2}), door:std(0x2e9a5a,.1,.6,{transparent:true,opacity:.75}),
};
// 地砖、卷帘门、接地暗影的程序纹理
function tileTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,256,256); g.strokeStyle='#b4bac1'; g.lineWidth=4; g.strokeRect(0,0,256,256);
  const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(1/1500,1/1500); t.anisotropy=8; return t; }
function slatTex(){ const c=document.createElement('canvas'); c.width=16; c.height=64; const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,16,64); g.fillStyle='#b9bec4'; for(let y=0;y<64;y+=8) g.fillRect(0,y,16,2);
  const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; return t; }
const AO_TEX=(()=>{ const c=document.createElement('canvas'); c.width=4; c.height=64; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,64); gr.addColorStop(0,'rgba(40,48,58,.42)'); gr.addColorStop(.35,'rgba(40,48,58,.14)'); gr.addColorStop(1,'rgba(40,48,58,0)');
  g.fillStyle=gr; g.fillRect(0,0,4,64); return new T.CanvasTexture(c); })();
const BLOB_TEX=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  g.filter='blur(14px)'; g.fillStyle='rgba(30,38,48,.55)'; g.fillRect(26,26,76,76); return new T.CanvasTexture(c); })();
const OVERLAY={transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-4};
const AO_MAT=new T.MeshBasicMaterial(Object.assign({map:AO_TEX},OVERLAY));
const BLOB_MAT=new T.MeshBasicMaterial(Object.assign({map:BLOB_TEX},OVERLAY));
// 接地暗影：比占地大一圈的模糊方块，铺在地面上
function blob(L,D,pad){ const m=new T.Mesh(new T.PlaneGeometry(L+pad*2.5,D+pad*2.5),BLOB_MAT); m.rotation.x=-Math.PI/2; m.position.y=2; m.renderOrder=1; return m; }
const LM={ aisle:new T.MeshBasicMaterial({map:stripeTex(),transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-6}) };
LM.aisle.map.encoding=T.sRGBEncoding;
let SHADOWS=true;
function box(w,h,d,mat,x,y,z,parent){ const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat); m.position.set(x||0,y||0,z||0); m.castShadow=SHADOWS; m.receiveShadow=SHADOWS; if(parent) parent.add(m); return m; }
function cyl(r,len,mat,axis,x,y,z,parent,seg){ const g=new T.CylinderGeometry(r,r,len,seg||24); if(axis==='x') g.rotateZ(Math.PI/2); if(axis==='z') g.rotateX(Math.PI/2);
  const m=new T.Mesh(g,mat); m.position.set(x||0,y||0,z||0); m.castShadow=SHADOWS; m.receiveShadow=SHADOWS; if(parent) parent.add(m); return m; }
function rectLine(w,d,color,y,dashed,cx,cz){
  const pts=[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2],[-w/2,-d/2]].map(([x,z])=>new T.Vector3(x+(cx||0),y,z+(cz||0)));
  const mat=dashed?new T.LineDashedMaterial({color,dashSize:150,gapSize:100}):new T.LineBasicMaterial({color});
  const l=new T.Line(new T.BufferGeometry().setFromPoints(pts),mat); if(dashed) l.computeLineDistances(); return l; }
function flat(w,d,color,op,y,cx,cz){ const m=new T.Mesh(new T.PlaneGeometry(w,d),new T.MeshBasicMaterial({color,opacity:op,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-8}));
  m.rotation.x=-Math.PI/2; m.position.set(cx||0,y,cz||0); m.renderOrder=3+Math.round(y); return m; }

function buildInspect(o){
  // 验布机：蓝色侧板（天蓝色）+ 灰绿色检测舱盖 + 底层输送区 + 中层检测台 + 右侧配电柜
  const g=new T.Group(), L=o.fw+700, D=1600, W=L-200;
  const skyBlue=std(0x3a8fd4,.15,.5);     // 天蓝色侧板
  const tealHood=std(0x4a7a72,.2,.55);    // 灰绿色舱盖
  const frameGray=std(0x5a6470,.2,.6);    // 深灰绿色框架

  // ── 底层机台（输送区，低矮灰色框架）──
  box(W,80,D,frameGray,0,40,0,g);          // 底板
  // 底层脚垫（4角）
  for(const fx of [-W/2+120,W/2-120]) for(const fz of [-D/2+120,D/2-120])
    cyl(55,80,M.dark,'y',fx,40,fz,g);
  // 底层框架侧边
  for(const s of [-1,1]){
    box(60,700,D,frameGray,s*(W/2-30),390,0,g);    // 左右纵梁
    box(W,60,60,frameGray,0,700,s*(D/2-30),g);     // 前后横梁
  }
  // 底层辊筒（放卷区，橙色纸管芯 + 钢轴）
  cyl(200,o.fw,M.roll,'x',0,340,-D/2+300,g);
  cyl(46,W-100,M.steel,'x',0,340,-D/2+300,g);
  // 底层传动辊
  cyl(70,W-100,M.steel,'x',0,520, D/2-300,g);
  cyl(55,W-100,M.steel,'x',0,620, 0,g);

  // ── 中层检测台（水平灰色台面，布料铺过）──
  box(W,30,D-200,frameGray,0,750,0,g);             // 台面板
  // 台面上导布辊
  cyl(55,W-60,M.steel,'x',0,790,-D/2+250,g);
  cyl(55,W-60,M.steel,'x',0,790, D/2-250,g);
  // 布料（斜铺过台面）
  const fb=box(o.fw,4,D-120,M.fabric,0,760,0,g); fb.rotation.x=.04;

  // 中间操作杆架（两个L形支架站在台面两端）
  for(const s of [-1,1]){
    box(50,500,50,frameGray,s*(W/2-200),1000,-D/2+200,g);  // 竖杆
    box(200,50,50,frameGray,s*(W/2-100),1480,-D/2+200,g);  // 横杆
  }
  // 操作控制盒（挂在横杆中央）
  box(240,180,80,M.dark,0,1520,-D/2+160,g);
  box(200,120,10,std(0x1a2a40,.1,.4),0,1540,-D/2+120,g);  // 屏幕
  // 红绿按钮
  cyl(22,12,std(0xcc2222,.1,.4),'z',-50,1580,-D/2+119,g);
  cyl(22,12,std(0x229933,.1,.4),'z', 50,1580,-D/2+119,g);

  // ── 右侧配电柜（蓝色，带门）──
  const cx=W/2+80, cw=500, ch=1800, cd=D;
  box(cw,ch,cd,skyBlue,cx,ch/2,0,g);
  box(cw+20,20,cd+20,M.alu,cx,ch,0,g);       // 顶盖
  box(cw+20,20,cd+20,M.dark,cx,10,0,g);      // 底座
  // 柜门分割线
  box(8,ch-100,4,M.alu,cx,ch/2,-cd/2+2,g);
  box(8,ch-100,4,M.alu,cx,ch/2, cd/2-2,g);
  // 铭牌
  box(200,130,8,M.white,cx+10,ch*0.75,cd/2+2,g);
  box(160,90,4,M.dark,cx+10,ch*0.75,cd/2+4,g);
  // 门把手
  box(20,120,20,M.steel,cx-2,ch*0.5,-cd/2+8,g);
  // 右侧电机（突出的绿色小电机）
  cyl(80,180,std(0x1a7a3a,.2,.5),'z',cx+cw/2,ch*0.4,D/2-300,g);
  cyl(22,200,M.steel,'z',cx+cw/2+90,ch*0.4,D/2-300,g);

  // ── 顶部灰绿色检测舱盖（大梯形盖，向后开口）──
  // 后背板（垂直）
  box(L+cw,1100,30,tealHood,cx/2,1250+550,-D/2+15,g);
  // 左斜面（从后背板顶部向前延伸）
  const lp=box(L+cw,30,1400,tealHood,cx/2,2300,0,g); lp.rotation.x=.18; // 顶盖
  const lf=box(L+cw,1100,30,tealHood,cx/2,1250+550,-D/2+15,g);          // 后墙（重用）
  // 顶盖前沿横梁
  box(L+cw+40,60,40,tealHood,cx/2,2420,-D/2+700,g);
  // 舱盖左右侧壁（三角形简化为梯形板）
  for(const s of [-1,1]){
    const sx=s*(L/2+cw/2-10);
    box(30,1100,1400,tealHood,cx/2+sx,1250+550,0,g);  // 侧壁
  }
  // 舱内顶部绿色绒布（检测面）
  box(L+cw-80,20,1350,std(0x2a5a30,.1,.9),cx/2,2260,30,g);
  // 舱内灯管
  box(W-100,14,60,M.lamp,0,2180,200,g);

  if(o.ai){ // 织鉴视觉检测架：型材龙门 + 线阵相机 + 条形光源
    for(const s of [-1,1]) box(40,1600,80,M.alu,s*(W/2-30),1100,D/2-40,g);
    box(W,80,40,M.alu,0,2660,D/2-40,g);
    const n=Math.max(2,Math.ceil(o.fw/410));
    for(let i=0;i<n;i++){
      const x=-o.fw/2+o.fw*(i+.5)/n;
      box(62,52,62,M.black,x,2580,D/2-40,g);
      cyl(22,64,M.dark,'y',x,2526,D/2-40,g);
    }
    box(W-80,50,70,M.dark,0,2380,D/2-160,g);
    box(W-120,6,52,M.lamp,0,2352,D/2-160,g);
    box(300,90,6,M.accent,0,2660,D/2-18,g);
  }
  return g;
}
function buildPack(){
  // 布匹自动包装机 LB04-180
  // 整体尺寸 4000×2700×2900，由三部分组成：
  //   左侧：配电柜（深蓝色独立方柜）
  //   中央：主机体（白色框架 + 绿色传送台 + 送膜立杆）
  //   两侧：废料箱（半透明网格柜）
  const g=new T.Group();
  const darkBlue=std(0x233570,.15,.5);
  const cageM=std(0x8a9bb0,.5,.4,{transparent:true,opacity:.38,depthWrite:false});

  // ── 配电柜（左侧，独立）──
  const CW=900, CH=1800, CD=700;
  const cx=-1550;
  box(CW,CH,CD,darkBlue,cx,CH/2,0,g);            // 柜体
  box(CW+20,30,CD+20,M.alu,cx,CH,0,g);           // 顶盖
  box(CW+20,30,CD+20,M.dark,cx,20,0,g);          // 底座
  box(80,CH-100,CD+4,std(0x1a2a5e,.1,.4),cx,CH/2,0,g); // 前门深色面板
  // 面板上的控制元件
  box(160,80,8,M.dark,cx-200,CH*0.72,CD/2+2,g);  // 显示屏
  box(60,60,8,std(0xcc2222,.1,.4),cx+120,CH*0.68,CD/2+2,g); // 急停
  for(let i=0;i<3;i++) box(40,40,8,std(0x229944,.1,.5),cx-80+i*60,CH*0.6,CD/2+2,g); // 指示灯
  box(180,30,8,M.steel,cx,CH*0.48,CD/2+2,g);     // 操作按钮条

  // ── 主机体（中央）──
  const MW=2200, MH=2600, MD=1400, mx=400;
  // 底部机台
  box(MW,300,MD,M.gray,mx,150,0,g);
  box(MW+40,30,MD+40,M.dark,mx,10,0,g);          // 底座压条
  // 左右立柱（白色）
  for(const s of [-1,1]){
    box(80,MH,80,M.white,mx+s*(MW/2-40),MH/2,MD/2-40,g);
    box(80,MH,80,M.white,mx+s*(MW/2-40),MH/2,-MD/2+40,g);
  }
  // 前后横梁
  box(MW,60,60,M.white,mx,MH-30,MD/2-40,g);
  box(MW,60,60,M.white,mx,MH-30,-MD/2+40,g);
  box(MW,60,60,M.white,mx,1200,MD/2-40,g);
  // 绿色传送平台
  box(MW-120,50,MD-100,M.green,mx,920,0,g);
  for(const s of [-1,1]) box(MW-100,80,30,M.steel,mx,960,s*(MD/2-70),g); // 传送带侧边导轨
  // 压膜横梁 + 热封刀
  box(MW-60,80,60,M.alu,mx,1600,0,g);
  box(MW-80,20,50,std(0xcc4400,.1,.5),mx,1640,0,g); // 热封条（橙红色）
  // 包装膜辊（顶部）
  cyl(120,MD-100,M.roll,'z',mx,MH-180,0,g);
  cyl(36,MD-100,M.steel,'z',mx,MH-180,0,g);
  // 送膜立杆（3根，带顶部导杆）
  for(const x of [mx-800,mx,mx+800]){
    cyl(35,800,M.steel,'y',x,MH+400,0,g);
    cyl(55,50,M.dark,'y',x,MH+800,0,g);
  }
  box(MW-100,40,40,M.steel,mx,MH+780,0,g); // 顶部横导杆

  // ── 废料箱（两侧，各一个）──
  const BW=700, BH=900, BD=700;
  for(const s of [-1,1]){
    const bx=mx+s*(MW/2+BW/2+80);
    box(BW,BH,BD,cageM,bx,BH/2,0,g);            // 半透明网格箱体
    box(BW+20,30,BD+20,M.steel,bx,BH,0,g);       // 顶框
    box(BW+20,30,BD+20,M.steel,bx,10,0,g);       // 底框
    for(const fz of [-1,1]) box(BW,BH,8,cageM,bx,BH/2,fz*(BD/2),g); // 前后网面
    for(const fx of [-1,1]) box(8,BH,BD,cageM,bx+fx*(BW/2),BH/2,0,g); // 左右网面
    // 万向轮
    for(const wx of [-1,1]) for(const wz of [-1,1])
      cyl(50,60,M.dark,'y',bx+wx*(BW/2-80),60,wz*(BD/2-80),g);
  }

  return g;
}
function buildShrink(){
  const g=new T.Group();
  box(1500,800,850,M.gray,0,1050,0,g);
  for(const s of [-1,1]) box(20,480,620,M.black,s*760,980,0,g);

  for(let x=-1140;x<=1140;x+=120) cyl(22,700,M.steel,'z',x,700,0,g,10);

  cyl(120,140,M.gray,'y',350,1520,0,g);

}
function buildConv(o){
  const g=new T.Group(), L=o.len, H=o.h;
  for(const s of [-1,1]) box(L,110,40,M.steel,0,H-55,s*330,g);
  box(L-60,24,600,M.belt,0,H-28,0,g);
  for(const s of [-1,1]) cyl(55,640,M.steel,'z',s*(L/2-40),H-55,0,g);
  const n=Math.max(2,Math.ceil(L/1500)+1);
  for(let i=0;i<n;i++){ const x=-L/2+80+(L-160)*i/(n-1);
    for(const s of [-1,1]) box(50,H-110,50,M.gray,x,(H-110)/2,s*300,g);
    box(50,50,600,M.gray,x,260,0,g); }
  if(o.push){ box(60,260,600,M.blue,-L/2+320,H+120,0,g); for(const s of [-1,1]) box(L-200,30,30,M.steel,0,H+230,s*280,g); }
  return g;
}

  const cx=-L/2+700;

  for(const s of [-1,1]) box(120,260,1100,M.dark,s*(L/2-60),130,0,g);
  return g;
}

function buildCart(){

function rectPoly(cx,cz,w,d,rotDeg,ox,oz){
  const r=rad(rotDeg||0), c=Math.cos(r), s=Math.sin(r);
  return [[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]].map(([x,z])=>{ x+=ox||0; z+=oz||0; return [cx+x*c+z*s, cz-x*s+z*c]; });
}
function pip(p,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,zi]=poly[i],[xj,zj]=poly[j];
  if(((zi>p[1])!==(zj>p[1]))&&(p[0]<(xj-xi)*(p[1]-zi)/(zj-zi)+xi)) inside=!inside; } return inside; }
function segX(a,b,c,d){ const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]));
  return o(a,b,c)*o(a,b,d)<0 && o(c,d,a)*o(c,d,b)<0; }
function overlap(P,Q,tol){ // 凸多边形 SAT；tol>0 时允许贴边
  for(const poly of [P,Q]) for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length], nx=b[1]-a[1], nz=a[0]-b[0], L=Math.hypot(nx,nz)||1;
    let p0=Infinity,p1=-Infinity,q0=Infinity,q1=-Infinity;
    for(const p of P){ const v=(p[0]*nx+p[1]*nz)/L; p0=Math.min(p0,v); p1=Math.max(p1,v); }
    for(const q of Q){ const v=(q[0]*nx+q[1]*nz)/L; q0=Math.min(q0,v); q1=Math.max(q1,v); }
    if(p1<=q0+tol||q1<=p0+tol) return false; }
  return true; }
function insideRoom(poly){
  const R=S.room; if(!R.closed||R.pts.length<3) return true;
  if(!poly.every(p=>pip(p,R.pts))) return false;
  for(let i=0;i<poly.length;i++) for(let j=0;j<R.pts.length;j++) if(segX(poly[i],poly[(i+1)%poly.length],R.pts[j],R.pts[(j+1)%R.pts.length])) return false;
  return true; }
function roomSegs(){ const P=S.room.pts, n=P.length, out=[]; const m=S.room.closed?n:n-1;
  for(let i=0;i<m;i++){ const a=P[i], b=P[(i+1)%n], dx=b[0]-a[0], dz=b[1]-a[1], len=Math.hypot(dx,dz); if(len<1) { out.push(null); continue; }
    const ux=dx/len, uz=dz/len; let nin=[-uz,ux];
    if(S.room.closed&&n>=3){ const mid=[(a[0]+b[0])/2+nin[0]*30,(a[1]+b[1])/2+nin[1]*30]; if(!pip(mid,P)) nin=[uz,-ux]; }
    out.push({i,a,b,len,u:[ux,uz],nin}); }
  return out; }
function doorGeom(d){ const sg=roomSegs()[d.seg]; if(!sg) return null; const off=Math.max(d.w/2,Math.min(sg.len-d.w/2,d.off));
  const cx=sg.a[0]+sg.u[0]*off, cz=sg.a[1]+sg.u[1]*off, clr=DOORS[d.kind].clr;
  const rot=Math.atan2(-sg.u[1],sg.u[0])*180/Math.PI;
  const zSign=Math.sign((-sg.u[1])*sg.nin[0]+sg.u[0]*sg.nin[1])||1;
  return {sg,off,cx,cz,rot,zSign,clrPoly:rectPoly(cx,cz,d.w,clr,rot,0,zSign*clr/2)}; }
const mPoly=m=>{ const [L,D]=sizeOf(m); return rectPoly(m.x,m.z,L,D,m.rot); };

function disposeTree(o){ o.traverse(c=>{ if(c.geometry) c.geometry.dispose(); }); }
// 墙内轮廓按墙厚向外偏移（角点斜接），挤出成一整圈墙：墙角干净，没有重叠面闪烁
function offsetPoly(P,t){
  const n=P.length, out=[];
  const nrm=(a,b)=>{ const dx=b[0]-a[0], dz=b[1]-a[1], L=Math.hypot(dx,dz)||1; return [dz/L,-dx/L]; };
  // 以第一条边判断法线朝向，整圈统一成朝外
  const m0=[(P[0][0]+P[1][0])/2,(P[0][1]+P[1][1])/2], t0=nrm(P[0],P[1]), flip=pip([m0[0]+t0[0]*30,m0[1]+t0[1]*30],P)?-1:1;
  for(let i=0;i<n;i++){
    const p0=P[(i-1+n)%n], p=P[i], p1=P[(i+1)%n];
    const n1=nrm(p0,p).map(v=>v*flip), n2=nrm(p,p1).map(v=>v*flip);
    const k=1+n1[0]*n2[0]+n1[1]*n2[1], f=1/Math.max(k,.2);
    out.push([p[0]+(n1[0]+n2[0])*t*f,p[1]+(n1[1]+n2[1])*t*f]);
  }
  return out;
}
function buildRoom(){
  if(roomGroup){ scene.remove(roomGroup); disposeTree(roomGroup); }
  roomGroup=new T.Group(); scene.add(roomGroup);
  const R=S.room, P=R.pts, plan=view==='plan';
  const H=plan||wallMode!=='cut'?R.h:Math.min(R.h,CUT_H);
  const ghost=!plan&&wallMode==='ghost';
  if(R.closed&&P.length>=3){
    const sh=new T.Shape(P.map(([x,z])=>new T.Vector2(x,-z)));
    const fg=new T.ShapeGeometry(sh); fg.rotateX(-Math.PI/2);
    const fl=new T.Mesh(fg,M.floor); fl.receiveShadow=true; fl.userData.ref={k:'room'}; roomGroup.add(fl);
    const O=offsetPoly(P,R.t);
    const ws=new T.Shape(O.map(([x,z])=>new T.Vector2(x,-z))); ws.holes.push(new T.Path(P.map(([x,z])=>new T.Vector2(x,-z))));
    const wg=new T.ExtrudeGeometry(ws,{depth:H,bevelEnabled:false}); wg.rotateX(-Math.PI/2);
    const wm=new T.Mesh(wg,ghost?M.wallT:[plan?M.wallPlan:M.wallCap,M.wallS]); wm.castShadow=!ghost&&!plan; wm.receiveShadow=true; wm.userData.ref={k:'room'}; roomGroup.add(wm);
    if(!ghost){
      roomGroup.add(new T.LineSegments(new T.EdgesGeometry(wg,30),new T.LineBasicMaterial({color:plan?0x3b434c:0xb3b9c0})));
    }
  } else {
    roomSegs().forEach(sg=>{ if(!sg) return;
      const nout=[-sg.nin[0],-sg.nin[1]], mx=(sg.a[0]+sg.b[0])/2+nout[0]*R.t/2, mz=(sg.a[1]+sg.b[1])/2+nout[1]*R.t/2;
      const w=box(sg.len+R.t,H,R.t,M.wallS,mx,H/2,mz,roomGroup); w.rotation.y=Math.atan2(-sg.u[1],sg.u[0]); w.userData.ref={k:'room'}; });
  }
  // 墙根接地暗影（墙内、墙外两侧）
  if(!plan&&!ghost) roomSegs().forEach(sg=>{ if(!sg) return;
    for(const inside of [true,false]){
      const w=inside?900:700, n=inside?sg.nin:[-sg.nin[0],-sg.nin[1]], off=inside?0:R.t, len=sg.len+(inside?0:R.t*2);
      const m=new T.Mesh(new T.PlaneGeometry(len,w),AO_MAT); m.rotation.x=-Math.PI/2; m.position.set(0,2,w/2); m.renderOrder=1;
      const g=new T.Group(); g.add(m);
      g.position.set((sg.a[0]+sg.b[0])/2+n[0]*off,0,(sg.a[1]+sg.b[1])/2+n[1]*off);
      // 让本地 +z 指向暗影要铺开的方向（墙面 → 远离墙）
      g.rotation.y=Math.atan2(n[0],n[1]);
      m.rotation.z=0; roomGroup.add(g);
    } });
}
function entityKey(kind,e){
  if(kind==='m') return e.t+JSON.stringify(e.o);
  if(kind==='col') return [e.s,S.room.h,wallMode,view].join();
  if(kind==='obs') return [e.w,e.d,e.h,e.el].join();
  if(kind==='aisle') return [e.w,e.d].join();
  if(kind==='door') return [view,wallMode,e.kind,e.w,e.h,S.room.t,JSON.stringify(doorGeom(e)&&doorGeom(e).sg.len),e.seg].join();
}
function buildEntity(kind,e){
  const g=new T.Group(); let L,D;
  if(kind==='m'){
    const C=CAT[e.t]; [L,D]=C.size(e.o);
    g.add(C.build(e.o));
    g.add(rectLine(L,D,0x56616c,9)); g.add(blob(L,D,450));
    if(C.op){ const z=new T.Group(); z.add(rectLine(L,C.op,0x2f80d0,6,true,0,D/2+C.op/2)); z.add(flat(L,C.op,0x2f80d0,.08,5,0,D/2+C.op/2)); g.add(z); g.userData.zone=z; }
  } else if(kind==='col'){
    L=D=e.s; const ch=view==='plan'||wallMode!=='cut'?S.room.h:Math.min(S.room.h,CUT_H);
    const cb=box(e.s,ch,e.s,M.concrete,0,ch/2,0,g); const ce=new T.LineSegments(new T.EdgesGeometry(cb.geometry),new T.LineBasicMaterial({color:0xb3b9c0})); ce.position.y=ch/2; g.add(ce); g.add(blob(e.s,e.s,350));
  } else if(kind==='obs'){
    L=e.w; D=e.d;
    if(!e.el) g.add(blob(e.w,e.d,300));
    const b=box(e.w,e.h,e.d,M.obs,0,e.el+e.h/2,0,g);
    const ed=new T.LineSegments(new T.EdgesGeometry(b.geometry),new T.LineBasicMaterial({color:0xb4621a})); ed.position.copy(b.position); g.add(ed);
    if(e.el>0){ g.add(rectLine(e.w,e.d,0xd9822b,4,true)); for(const [x,z] of [[-1,-1],[1,-1],[1,1],[-1,1]]) g.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(x*e.w/2,0,z*e.d/2),new T.Vector3(x*e.w/2,e.el,z*e.d/2)]),new T.LineDashedMaterial({color:0xd9822b,dashSize:120,gapSize:120})).computeLineDistances()); }
  } else if(kind==='aisle'){
    L=e.w; D=e.d;
    const mat=LM.aisle.clone(); mat.map=LM.aisle.map.clone(); mat.map.needsUpdate=true; mat.map.repeat.set(e.w/700,e.d/700);
    const p=new T.Mesh(new T.PlaneGeometry(e.w,e.d),mat); p.rotation.x=-Math.PI/2; p.position.y=3; p.renderOrder=2; g.add(p);
    g.add(rectLine(e.w,e.d,0xd4b106,4));
  } else if(kind==='door'){
    const dg=doorGeom(e); if(!dg) return g;
    L=e.w; D=S.room.t+80; const clr=DOORS[e.kind].clr;
    const zc=-dg.zSign*S.room.t/2, t=S.room.t, wh=view==='plan'||wallMode!=='cut'?S.room.h:Math.min(S.room.h,CUT_H), dh=Math.min(e.h,wh-40);
    if(view==='plan'){ box(e.w,wh+20,t+40,M.door,0,wh/2,zc,g); }
    else {
      // 门扇略凸出墙两面，加门框；卷帘门用横条纹理
      let leaf=M.doorLeaf;
      if(e.kind==='gate'){ leaf=M.gateLeaf.clone(); leaf.map=M.gateLeaf.map.clone(); leaf.map.needsUpdate=true; leaf.map.repeat.set(1,dh/400); }
      box(e.w,dh,t+24,leaf,0,dh/2,zc,g).castShadow=false;
      for(const sx of [-1,1]) box(70,dh+70,t+44,M.doorFrame,sx*(e.w/2+35),(dh+70)/2,zc,g).castShadow=false;
      if(e.h<wh) box(e.w+140,70,t+44,M.doorFrame,0,dh+35,zc,g).castShadow=false;
      if(e.kind==='door') box(120,18,t+60,M.doorFrame,e.w*.34,dh*.48,zc,g);
    }
    const z=new T.Group(); z.add(flat(e.w,clr,0x2e9a5a,.14,4,0,dg.zSign*clr/2)); z.add(rectLine(e.w,clr,0x2e9a5a,5,true,0,dg.zSign*clr/2)); g.add(z); g.userData.zone=z;
    D=S.room.t+80;
  }
  // 冲突高亮底色 + 选中框
  const st=flat(L,D,0xe5484d,0,7); g.add(st); g.userData.st=st;
  const sel=rectLine(L+160,D+160,0x1f6fb2,10); sel.visible=false; sel.material.linewidth=2; g.add(sel); g.userData.sel=sel;
  return g;
}
function placeEntity(kind,e,g){
  if(kind==='door'){ const dg=doorGeom(e); if(dg){ g.position.set(dg.cx,0,dg.cz); g.rotation.y=rad(dg.rot); } return; }
  g.position.set(e.x,0,e.z); g.rotation.y=rad(e.rot||0);
}
const KINDS=[['m','mach'],['col','cols'],['obs','obs'],['aisle','aisles'],['door','doors']];
function each(fn){ for(const [k,arr] of KINDS) for(const e of S[arr]) fn(k,e); }
function findRef(ref){ if(!ref) return null; const arr=(KINDS.find(k=>k[0]===ref.k)||[])[1]; return arr?S[arr].find(e=>e.id===ref.id):null; }

function sync(){
  const rk=JSON.stringify(S.room)+wallMode+view;
  if(rk!==roomKey){ roomKey=rk; buildRoom(); }
  const seen=new Set();
  each((kind,e)=>{
    seen.add(e.id);
    const key=entityKey(kind,e); let o=objs.get(e.id);
    if(!o||o.key!==key){ if(o){ scene.remove(o.g); disposeTree(o.g); } o={g:buildEntity(kind,e),key,kind}; o.g.userData.ref={k:kind,id:e.id}; scene.add(o.g); objs.set(e.id,o); }
    placeEntity(kind,e,o.g);
  });
  for(const [id,o] of objs) if(!seen.has(id)){ scene.remove(o.g); disposeTree(o.g); objs.delete(id); }
  pickables=[...objs.values()].map(o=>o.g); if(roomGroup) pickables.push(roomGroup);
  runChecks(); applySelection(); buildLabels(); renderSum(); updateShadowBox();
}

let issues=[], status=new Map();
const nameOf=(k,e)=>k==='m'?e.name:k==='col'?'承重柱':k==='obs'?e.name:k==='aisle'?'通道':k==='door'?DOORS[e.kind].name:'厂房';
function runChecks(){
  issues=[]; status=new Map();
  const add=(sev,ref,msg,why)=>{ issues.push({sev,ref,msg,why}); const cur=status.get(ref.id); if(cur!=='err') status.set(ref.id,sev); };
  const R=S.room;
  const solids=[...S.cols.map(c=>({k:'col',e:c,poly:rectPoly(c.x,c.z,c.s,c.s,0),top:R.h,bot:0})),
                ...S.obs.map(o=>({k:'obs',e:o,poly:rectPoly(o.x,o.z,o.w,o.d,o.rot),top:o.el+o.h,bot:o.el}))];
  const doorZ=S.doors.map(d=>({d,g:doorGeom(d)})).filter(x=>x.g);
  const ms=S.mach.map(m=>({m,poly:mPoly(m),op:CAT[m.t].op?rectPoly(m.x,m.z,sizeOf(m)[0],CAT[m.t].op,m.rot,0,sizeOf(m)[1]/2+CAT[m.t].op/2):null,H:sizeOf(m)[2]}));
  ms.forEach((A,i)=>{
    const ref={k:'m',id:A.m.id}, nm=A.m.name;
    if(R.closed&&R.pts.length>=3&&!insideRoom(A.poly)) add('err',ref,`${nm} 超出厂房边界`,'挪回墙内，或调整厂房轮廓');
    if(A.H>R.h) add('err',ref,`${nm} 高 ${fmtM(A.H)}，超过厂房层高 ${fmtM(R.h)}`,'');
    for(const s of solids) if(overlap(A.poly,s.poly,0)){
      if(s.bot>=A.H) continue;
      if(s.bot>0) add('err',ref,`${nm} 撞到 ${nameOf(s.k,s.e)}`,`${nameOf(s.k,s.e)} 离地 ${fmtM(s.bot)}，机器高 ${fmtM(A.H)}`);
      else add('err',ref,`${nm} 与 ${nameOf(s.k,s.e)} 重叠`,'');
    }
    for(let j=i+1;j<ms.length;j++) if(overlap(A.poly,ms[j].poly,30)){ add('err',ref,`${nm} 与 ${ms[j].m.name} 重叠`,''); add('err',{k:'m',id:ms[j].m.id},`${ms[j].m.name} 与 ${nm} 重叠`,''); }
    for(const {d,g} of doorZ) if(overlap(A.poly,g.clrPoly,0)) add('warn',ref,`${nm} 挡住了${DOORS[d.kind].name}`,`门口留 ${fmtM(DOORS[d.kind].clr)} 进出空间`);
    for(const a of S.aisles) if(overlap(A.poly,rectPoly(a.x,a.z,a.w,a.d,a.rot),0)) add('warn',ref,`${nm} 占用了通道`,'通道需要保持畅通');
    if(A.op){
      const hit=[];
      if(R.closed&&R.pts.length>=3&&!insideRoom(A.op)) hit.push('墙体');
      for(const s of solids) if(s.bot<2000&&overlap(A.op,s.poly,0)) hit.push(nameOf(s.k,s.e));
      ms.forEach((B,j)=>{ if(j!==i&&overlap(A.op,B.poly,30)) hit.push(B.m.name); });
      if(hit.length) add('warn',ref,`${nm} 操作区被 ${[...new Set(hit)].join('、')} 挡住`,`正面要留 ${fmtM(CAT[A.m.t].op)} 给操作工`);
    }
  });
  for(const {d,g} of doorZ){
    for(const s of solids) if(s.bot<2200&&overlap(g.clrPoly,s.poly,0)) add('warn',{k:'door',id:d.id},`${DOORS[d.kind].name} 门口被 ${nameOf(s.k,s.e)} 挡住`,'');
    if(d.h>R.h) add('err',{k:'door',id:d.id},`${DOORS[d.kind].name} 比层高还高`,'');
  }
  // 着色
  for(const [id,o] of objs){ const st=o.g.userData.st; if(!st) continue; const s=status.get(id);
    st.material.opacity=s?.45:0; st.material.color.set(s==='err'?0xe5484d:0xf0a54a); }
  renderIssues();
}
function renderIssues(){
  const nE=issues.filter(i=>i.sev==='err').length, nW=issues.length-nE, b=$('badge');
  b.className='badge'+(issues.length?(nE?'':' warn'):' ok'); b.textContent=issues.length?issues.length:'✓';
  const box=$('check');
  if(!issues.length){ box.innerHTML=`<div class="okbox"><b>✓ 没有发现碰撞和遮挡</b><br>已检查：设备是否超出墙体、与柱子/障碍物/其他设备重叠、超过层高、挡门、占用通道，以及操作区是否留够。</div>`; return; }

let lblSig='';
function buildLabels(){
  const specs=[]; const mk=(text,cls,pos)=>specs.push({text,cls:'lbl '+cls,pos});
  collectLabels(mk);
  const sig=specs.map(x=>x.cls+'|'+x.text).join('\n');
  if(sig!==lblSig||lblBox.children.length!==specs.length){
    lblSig=sig; lblBox.innerHTML='';
    labels=specs.map(x=>{ const el=document.createElement('span'); el.className=x.cls; el.textContent=x.text; lblBox.appendChild(el); return {el,pos:x.pos}; });
  } else specs.forEach((x,i)=>{ labels[i].pos=x.pos; });
}
function collectLabels(mk){
  if(!showLabels) return;
  roomSegs().forEach(sg=>{ if(!sg) return; const nout=[-sg.nin[0],-sg.nin[1]];
    mk(fmtM(sg.len),'dim',()=>new T.Vector3((sg.a[0]+sg.b[0])/2+nout[0]*(S.room.t+700),0,(sg.a[1]+sg.b[1])/2+nout[1]*(S.room.t+700))); });
  S.mach.forEach(m=>{ const s=status.get(m.id); mk(m.name,'m '+(s||''),()=>new T.Vector3(m.x,view==='plan'?0:sizeOf(m)[2]+250,m.z)); });
  S.obs.forEach(o=>mk(o.el>0?`${o.name} · 离地 ${fmtM(o.el)}`:o.name,'obs',()=>new T.Vector3(o.x,view==='plan'?0:o.el+o.h+200,o.z)));
  S.aisles.forEach(a=>mk('通道','aisle',()=>new T.Vector3(a.x,0,a.z)));
  S.doors.forEach(d=>{ const g=doorGeom(d); if(g) mk(`${DOORS[d.kind].name} ${fmtM(d.w)}`,'door',()=>new T.Vector3(g.cx+g.sg.nin[0]*(DOORS[d.kind].clr+400),view==='plan'?0:d.h+300,g.cz+g.sg.nin[1]*(DOORS[d.kind].clr+400))); });
}
const live={}; // 临时标注：画墙时的长度、测距
function liveLabel(key,text,pos){ let L=live[key]; if(!L){ L=live[key]={el:document.createElement('span')}; L.el.className='lbl live'; $('stage').appendChild(L.el); L.el.style.zIndex=3; }
  L.el.textContent=text; L.p=pos; L.el.style.display=text?'':'none'; }
function placeLabels(){
  const r=stage.getBoundingClientRect(), c=cam(), v=new T.Vector3();
  const put=(el,p)=>{ v.copy(p).project(c); const off=v.z>1||v.x<-1.2||v.x>1.2||v.y<-1.2||v.y>1.2; el.style.visibility=off?'hidden':'';
    el.style.left=((v.x+1)/2*r.width)+'px'; el.style.top=((1-v.y)/2*r.height)+'px'; };
  for(const l of labels) put(l.el,l.pos());
  for(const k in live) if(live[k].p) put(live[k].el,live[k].p);
}

function roomProps(){

let hist=[], hi=-1;
function commit(noHist){
  if(!noHist){ hist=hist.slice(0,hi+1); hist.push(JSON.stringify(S)); if(hist.length>80) hist.shift(); hi=hist.length-1; }
  sync(); renderProps(); updateUndo();
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(S)); }catch(e){}
}
function undo(){ if(hi<=0) return; hi--; S=JSON.parse(hist[hi]); if(selRef&&!findRef(selRef)) selRef=null; commit(true); }
function redo(){ if(hi>=hist.length-1) return; hi++; S=JSON.parse(hist[hi]); commit(true); }
function updateUndo(){ $('bUndo').disabled=hi<=0; $('bRedo').disabled=hi>=hist.length-1; }
$('bUndo').onclick=undo; $('bRedo').onclick=redo;

// 指针交互
// ================================================================
const ray=new T.Raycaster(), ndc=new T.Vector2(), gplane=new T.Plane(new T.Vector3(0,1,0),0);
function setRay(e){ const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,cam()); }
function groundAt(e){ setRay(e); const p=new T.Vector3(); return ray.ray.intersectPlane(gplane,p)?[p.x,p.z]:null; }
function pickAt(e){ setRay(e); scene.updateMatrixWorld();
  const hs=ray.intersectObjects([...handles.children],false); if(hs.length) return hs[0].object.userData.ref;
  const hits=ray.intersectObjects(pickables,true);
  for(const h of hits){ let o=h.object; while(o&&!o.userData.ref) o=o.parent; if(o&&o.userData.ref.k!=='room') return o.userData.ref; }
  return hits.length?{k:'room'}:null; }
const snap=(v,s)=>Math.round(v/s)*s;
function snapP(p,s,e){ return e&&e.shiftKey?[Math.round(p[0]),Math.round(p[1])]:[snap(p[0],s),snap(p[1],s)]; }
function orthoSnap(p,from){ const dx=p[0]-from[0], dz=p[1]-from[1], t=Math.tan(rad(10));
  if(Math.abs(dz)<Math.abs(dx)*t) return [p[0],from[1]]; if(Math.abs(dx)<Math.abs(dz)*t) return [from[0],p[1]]; return p; }
function nearestSeg(p){ let best=null; roomSegs().forEach(sg=>{ if(!sg) return; let t=((p[0]-sg.a[0])*sg.u[0]+(p[1]-sg.a[1])*sg.u[1]); t=Math.max(0,Math.min(sg.len,t));
  const d=Math.hypot(sg.a[0]+sg.u[0]*t-p[0],sg.a[1]+sg.u[1]*t-p[1]); if(!best||d<best.d) best={sg,t,d}; }); return best; }

function onDown(e){
  if(e.button!==0) return;
  canvas.focus();
  const p=groundAt(e); if(!p) return;
  let handled=true;
  if(placing){ placeGhost(p,e); if(!e.shiftKey) stopPlacing(); }
  else if(tool==='select'){
    const ref=pickAt(e);
    if(!ref||ref.k==='room'){ select(ref); handled=false; }
    else if(ref.k==='vtx'){ drag={vtx:ref.i}; }
    else { select(ref); const ent=findRef(ref); drag={ref,start:p,orig:ref.k==='door'?{off:ent.off,seg:ent.seg}:{x:ent.x,z:ent.z},moved:false}; }
  }
  else if(tool==='wall') wallClick(p,e);
  else if(tool==='door'){ const n=nearestSeg(p); if(n&&n.d<1500){ const k=toolCfg.door; S.doors.push({id:uid(),seg:n.sg.i,off:n.t,kind:k,w:DOORS[k].w,h:DOORS[k].h}); commit(); } else toast('请把门放在墙上'); }
  else if(tool==='col'){ const q=snapP(p,100,e); S.cols.push({id:uid(),x:q[0],z:q[1],s:toolCfg.colS}); commit(); }
  else if(tool==='obs'||tool==='aisle'){ rectDrag={a:snapP(p,100,e),b:snapP(p,100,e)}; }
  else if(tool==='measure'){ const q=snapP(p,50,e); if(!measure||measure.done) measure={a:q,b:q,done:false}; else { measure.b=q; measure.done=true; } drawMeasure(); }
  if(handled){ setControlsEnabled(false); try{ canvas.setPointerCapture(e.pointerId); }catch(err){} e.preventDefault(); }
}
canvas.addEventListener('pointermove',e=>{
  const p=groundAt(e); cursorP=p; if(!p) return;
  $('status').textContent=`X ${(p[0]/1000).toFixed(2)} m  Y ${(p[1]/1000).toFixed(2)} m`;
  if(placing){ moveGhost(p,e); return; }
  if(drag){ dragMove(p,e); return; }
  if(tool==='select'){ const ref=pickAt(e); canvas.style.cursor=ref&&ref.k!=='room'?'move':''; }
  else if(tool==='wall') wallPreview(p,e);
  else if(tool==='door') doorPreview(p);
  else if(tool==='col'){ clearPreview(); const q=snapP(p,100,e); const c=box(toolCfg.colS,S.room.h,toolCfg.colS,new T.MeshBasicMaterial({color:0x1f6fb2,transparent:true,opacity:.35}),q[0],S.room.h/2,q[1]); preview.add(c); }
  else if((tool==='obs'||tool==='aisle')&&rectDrag){ rectDrag.b=snapP(p,100,e); rectPreview(); }
  else if(tool==='measure'&&measure&&!measure.done){ measure.b=snapP(p,50,e); drawMeasure(); }
});
canvas.addEventListener('pointerup',e=>{
  if(e.button!==0) return;
  if(drag){ if(drag.moved||drag.vtx!=null) commit(); drag=null; }
  if(rectDrag){ const {a,b}=rectDrag, w=Math.abs(b[0]-a[0]), d=Math.abs(b[1]-a[1]); rectDrag=null; clearPreview(); liveLabel('len','');
    if(w>=200&&d>=200){ const c={id:uid(),x:(a[0]+b[0])/2,z:(a[1]+b[1])/2,w,d,rot:0};
      if(tool==='obs'){ const o=toolCfg.obsCustom; Object.assign(c,{name:o.name,h:o.h,el:o.el}); S.obs.push(c); select({k:'obs',id:c.id}); }
      else { S.aisles.push(c); select({k:'aisle',id:c.id}); }
      commit(); } else toast('拖拽画出一个范围'); }
  setControlsEnabled(true);
});
canvas.addEventListener('pointerleave',()=>{ if(tool!=='wall'&&!rectDrag) clearPreview(); });
canvas.addEventListener('dblclick',()=>{ if(tool==='wall'&&draft&&draft.pts.length>=3) finishDraft(); });

// ---------- 拖动 ----------
function dragMove(p,e){
  if(drag.vtx!=null){ const q=snapP(p,100,e); S.room.pts[drag.vtx]=q; sync(); showHandles(true); return; }
  const ent=findRef(drag.ref); if(!ent) return;
  drag.moved=true;
  if(drag.ref.k==='door'){ const n=nearestSeg(p); if(n){ ent.seg=n.sg.i; ent.off=Math.round(n.t/50)*50; } }
  else {
    const s=drag.ref.k==='m'?50:100;
    ent.x=drag.orig.x+snap(p[0]-drag.start[0],s); ent.z=drag.orig.z+snap(p[1]-drag.start[1],s);
    if(drag.ref.k==='m'&&!e.shiftKey) magnet(ent);
  }
  sync();
}
// 设备之间贴边吸附（只对 0/90/180/270° 的设备）
function aabb(m){ const [L,D]=sizeOf(m), sw=(m.rot%180)!==0; const w=sw?D:L, d=sw?L:D; return {x0:m.x-w/2,x1:m.x+w/2,z0:m.z-d/2,z1:m.z+d/2}; }
function magnet(m){
  if(m.rot%90) return; const TH=150; let a=aabb(m), dx=null, dz=null;
  for(const o of S.mach){ if(o===m||o.rot%90) continue; const b=aabb(o);
    const zNear=a.z0<b.z1+TH&&a.z1>b.z0-TH, xNear=a.x0<b.x1+TH&&a.x1>b.x0-TH;
    if(zNear&&dx==null) for(const d of [b.x1-a.x0,b.x0-a.x1]) if(Math.abs(d)<TH){ dx=d; break; }
    if(xNear&&dz==null) for(const d of [b.z1-a.z0,b.z0-a.z1]) if(Math.abs(d)<TH){ dz=d; break; }
    if(dx!=null&&dz==null&&Math.abs((a.z0+a.z1)/2-(b.z0+b.z1)/2)<TH) dz=(b.z0+b.z1)/2-(a.z0+a.z1)/2;
    if(dz!=null&&dx==null&&Math.abs((a.x0+a.x1)/2-(b.x0+b.x1)/2)<TH) dx=(b.x0+b.x1)/2-(a.x0+a.x1)/2;
  }
  if(dx) m.x+=dx; if(dz) m.z+=dz;
}

// ---------- 画墙 ----------
function wallCursor(p,e){ let q=snapP(p,100,e); if(draft&&draft.pts.length){ const last=draft.pts[draft.pts.length-1]; if(!e.altKey) q=orthoSnap(q,last);
  const f=draft.pts[0]; if(draft.pts.length>=3&&Math.hypot(q[0]-f[0],q[1]-f[1])<700) return {q:f,close:true}; } return {q,close:false}; }
function wallClick(p,e){
  const {q,close}=wallCursor(p,e);
  if(!draft){ draft={pts:[q]}; }
  else if(close){ finishDraft(); return; }
  else { const l=draft.pts[draft.pts.length-1]; if(Math.hypot(q[0]-l[0],q[1]-l[1])>50) draft.pts.push(q); }
  numBuf=''; wallPreview(p,e); updateHint();
}
function wallPreview(p,e){
  clearPreview(); if(!draft){ if(p){ const q=snapP(p,100,e||{}); preview.add(dot(q[0],q[1],0x1f6fb2)); } return; }
  const {q,close}=p?wallCursor(p,e||{}):{q:draft.pts[draft.pts.length-1],close:false};
  const pts=[...draft.pts,q].map(([x,z])=>new T.Vector3(x,25,z));
  const ln=new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:0x1f6fb2})); preview.add(ln);
  draft.pts.forEach((pt,i)=>preview.add(dot(pt[0],pt[1],i===0&&close?0x2ecc71:0x1f6fb2)));
  const l=draft.pts[draft.pts.length-1], len=Math.hypot(q[0]-l[0],q[1]-l[1]);
  liveLabel('len',len>0?(len/1000).toFixed(2)+' m':'',new T.Vector3((q[0]+l[0])/2,0,(q[1]+l[1])/2));
}
function finishDraft(){
  if(!draft||draft.pts.length<3) return toast('厂房轮廓至少要 3 个角');
  S.room.pts=draft.pts; S.room.closed=true;
  const n=S.room.pts.length; S.doors=S.doors.filter(d=>d.seg<n);
  draft=null; clearPreview(); liveLabel('len',''); commit(); setTool('select'); fitView(); toast('厂房轮廓已闭合，可以拖动墙角调整');
}
function wallTypedLength(){
  if(!draft||!numBuf) return false; const len=parseFloat(numBuf)*1000; numBuf=''; if(!(len>0)) return true;
  const l=draft.pts[draft.pts.length-1]; let dir=[1,0];
  if(cursorP){ const q=orthoSnap(cursorP,l); const dx=q[0]-l[0], dz=q[1]-l[1], L=Math.hypot(dx,dz); if(L>1) dir=[dx/L,dz/L]; }
  draft.pts.push([Math.round(l[0]+dir[0]*len),Math.round(l[1]+dir[1]*len)]); wallPreview(cursorP,{}); return true;
}

// ---------- 门 / 矩形 / 测距预览 ----------
function doorPreview(p){
  clearPreview(); const n=nearestSeg(p); if(!n||n.d>1500) return;
  const d={kind:toolCfg.door,w:DOORS[toolCfg.door].w,h:DOORS[toolCfg.door].h,seg:n.sg.i,off:n.t};
  const g=doorGeom(d); const m=box(d.w,d.h,S.room.t+100,new T.MeshBasicMaterial({color:0x2e9a5a,transparent:true,opacity:.55}),0,d.h/2,0); const grp=new T.Group(); grp.add(m);
  grp.add(flat(d.w,DOORS[d.kind].clr,0x2e9a5a,.18,4,0,g.zSign*DOORS[d.kind].clr/2)); grp.position.set(g.cx,0,g.cz); grp.rotation.y=rad(g.rot); preview.add(grp);
}
function rectPreview(){
  clearPreview(); const {a,b}=rectDrag, w=Math.abs(b[0]-a[0]), d=Math.abs(b[1]-a[1]); if(w<1||d<1) return;
  const cx=(a[0]+b[0])/2, cz=(a[1]+b[1])/2;
  if(tool==='obs'){ const o=toolCfg.obsCustom; preview.add(box(w,o.h,d,new T.MeshBasicMaterial({color:0xe08a2c,transparent:true,opacity:.4}),cx,o.el+o.h/2,cz)); }
  else preview.add(flat(w,d,0xd4b106,.35,5,cx,cz));
  preview.add(rectLine(w,d,0x1f6fb2,12,false,cx,cz));
  liveLabel('len',`${(w/1000).toFixed(1)} × ${(d/1000).toFixed(1)} m`,new T.Vector3(cx,0,cz));
}
function drawMeasure(){
  clearPreview(); if(!measure) return; const {a,b}=measure;
  preview.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(a[0],30,a[1]),new T.Vector3(b[0],30,b[1])]),new T.LineBasicMaterial({color:0xe5484d})));
  preview.add(dot(a[0],a[1],0xe5484d,90)); preview.add(dot(b[0],b[1],0xe5484d,90));
  const L=Math.hypot(b[0]-a[0],b[1]-a[1]); liveLabel('m',L>0?(L/1000).toFixed(2)+' m':'',new T.Vector3((a[0]+b[0])/2,0,(a[1]+b[1])/2));
}

// ---------- 从设备库放置 ----------
function startPlacing(item){
  if(tool!=='select') setTool('select');
  placing={item,name:item.name,rot:0}; select(null);
  document.querySelectorAll('.card-m').forEach(c=>c.classList.toggle('on',c.dataset.i==LIB.indexOf(item)));
  const m={t:item.t,o:item.o}; ghost=CAT[item.t].build(item.o);
  ghost.traverse(c=>{ if(c.isMesh){ c.material=c.material.clone(); c.material.transparent=true; c.material.opacity=Math.min(c.material.opacity,.55); c.castShadow=false; } });
  const [L,D]=sizeOf(m); ghost.add(rectLine(L,D,0x1f6fb2,10)); if(CAT[item.t].op) ghost.add(flat(L,CAT[item.t].op,0x2f80d0,.12,5,0,D/2+CAT[item.t].op/2));
  ghost.visible=false; scene.add(ghost); updateHint();
}
function stopPlacing(){ if(ghost){ scene.remove(ghost); disposeTree(ghost); } ghost=null; placing=null; $('ghostCard').style.display='none'; document.querySelectorAll('.card-m').forEach(c=>c.classList.remove('on')); updateHint(); }
function moveGhost(p,e){ if(!ghost) return; const q=snapP(p,50,e); ghost.visible=true; ghost.position.set(q[0],0,q[1]); ghost.rotation.y=rad(placing.rot); }
function placeGhost(p,e){
  const it=placing.item, q=snapP(p,50,e);
  const m={id:uid(),t:it.t,name:it.name,x:q[0],z:q[1],rot:placing.rot,o:clone(it.o)};
  if(!e.shiftKey) magnet(m);
  S.mach.push(m); commit(); select({k:'m',id:m.id});
}
// 设备库：按下卡片开始放置；拖到画布上松手直接放下；只点一下则跟随鼠标，再点画布放下
window.addEventListener('pointermove',e=>{ if(!placing) return; const gc=$('ghostCard'); const over=e.target===canvas;
  gc.style.display=over?'none':'block'; gc.textContent='放到厂房里：'+placing.name; gc.style.left=e.clientX+'px'; gc.style.top=e.clientY+'px';
  if(over){ const p=groundAt(e); if(p) moveGhost(p,e); } else if(ghost) ghost.visible=false; });
window.addEventListener('pointerup',e=>{ if(!placing||!placing.dragging) return; placing.dragging=false;
  const r=canvas.getBoundingClientRect();
  if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){ const p=groundAt(e); if(p){ placeGhost(p,e); stopPlacing(); } } });

document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k=e.key;
  if((e.ctrlKey||e.metaKey)&&(k==='z'||k==='Z')){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='y'||k==='Y')){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='d'||k==='D')){ e.preventDefault(); dupSel(); return; }
  if(tool==='wall'&&draft){
    if(/^[0-9.]$/.test(k)){ numBuf+=k; updateHint(); e.preventDefault(); return; }
    if(k==='Backspace'){ if(numBuf) numBuf=numBuf.slice(0,-1); else if(draft.pts.length>1) draft.pts.pop(); else draft=null; wallPreview(cursorP,{}); updateHint(); e.preventDefault(); return; }
    if(k==='Enter'){ if(!wallTypedLength()&&draft.pts.length>=3) finishDraft(); updateHint(); e.preventDefault(); return; }
  }
  if(k==='Escape'){ if(placing) stopPlacing(); else if(draft||rectDrag||measure){ cancelTransient(); measure=null; liveLabel('m',''); updateHint(); } else { select(null); setTool('select'); } return; }
  if(k==='r'||k==='R'){ if(placing){ placing.rot=(placing.rot+90)%360; if(ghost) ghost.rotation.y=rad(placing.rot); } else rotateSel(e.shiftKey?-90:90); return; }
  if(k==='Delete'||k==='Backspace'){ delSel(); e.preventDefault(); return; }
  if(k==='f'||k==='F'){ fitView(); return; }
  const t=TOOLS.find(x=>x[2].toLowerCase()===k.toLowerCase()); if(t&&!e.ctrlKey&&!e.metaKey) setTool(t[0]);
});

// ================================================================
function bbox(){
  const P=S.room.pts.length?S.room.pts:S.mach.map(m=>[m.x,m.z]);
  if(!P.length) return {x0:0,x1:20000,z0:0,z1:15000,w:0,d:0,cx:10000,cz:7500};
  let x0=Infinity,x1=-Infinity,z0=Infinity,z1=-Infinity; for(const [x,z] of P){ x0=Math.min(x0,x); x1=Math.max(x1,x); z0=Math.min(z0,z); z1=Math.max(z1,z); }
  return {x0,x1,z0,z1,w:x1-x0,d:z1-z0,cx:(x0+x1)/2,cz:(z0+z1)/2};
}
function setView(v){
  view=v; document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
  setControlsEnabled(true); resize(); lblBox.classList.toggle('plan',v==='plan'); updateShadowBox();
  grid1.visible=grid5.visible=v==='plan'; roomKey=''; sync();
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function fitView(){
  const ZF=+QS.get('zoom')||1;
  const b=bbox(), r=stage.getBoundingClientRect(), asp=r.width/Math.max(1,r.height), W=Math.max(b.w,6000)+9000, D=Math.max(b.d,6000)+7000;
  orthoH=Math.max(D,W/asp); ortho.zoom=1; ctlO.target.set(b.cx,0,b.cz); ortho.position.set(b.cx,80000,b.cz+1); updateOrtho();
  const R=Math.max(W,D*1.3)/ZF; ctlP.target.set(QS.has('tx')?+QS.get('tx'):b.cx,0,QS.has('tz')?+QS.get('tz'):b.cz-D*.04); persp.position.copy(ctlP.target).add(new T.Vector3(R*.12,R*1.05,R*.62)); ctlP.update(); ctlO.update();
}
function updateOrtho(){ const r=stage.getBoundingClientRect(), asp=r.width/Math.max(1,r.height); ortho.top=orthoH/2; ortho.bottom=-orthoH/2; ortho.left=-orthoH*asp/2; ortho.right=orthoH*asp/2; ortho.updateProjectionMatrix(); }
function focusOn(ref){ const e=findRef(ref); if(!e) return; let x=e.x,z=e.z; if(ref.k==='door'){ const g=doorGeom(e); x=g.cx; z=g.cz; }
  const c=ctl(), dx=x-c.target.x, dz=z-c.target.z; c.target.x+=dx; c.target.z+=dz; cam().position.x+=dx; cam().position.z+=dz; }
function updateShadowBox(){ const b=bbox(), R=Math.max(b.w,b.d)/2+6000; // 平面图里太阳放正上方，阴影只落在设备脚下
  if(view==='plan') sun.position.set(b.cx+1,R*2,b.cz+1); else sun.position.set(b.cx-R*.45,R*1.5,b.cz+R*.7); sun.target.position.set(b.cx,0,b.cz);
  Object.assign(sun.shadow.camera,{left:-R,right:R,top:R,bottom:-R,near:100,far:R*5}); sun.shadow.camera.updateProjectionMatrix(); }
function resize(){ const r=stage.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); persp.aspect=r.width/Math.max(1,r.height); persp.updateProjectionMatrix(); updateOrtho(); }
addEventListener('resize',resize);

    if(cs.backgroundColor&&cs.backgroundColor!=='rgba(0, 0, 0, 0)'){ g.fillStyle=cs.backgroundColor; g.fillRect(x,y,r.width*k,r.height*k); }
    g.fillStyle=cs.color; g.fillText(el.textContent,x+6*k,y+r.height*k/2); });
  g.fillStyle='rgba(13,24,34,.85)'; g.fillRect(0,c.height-30*k,c.width,30*k); g.fillStyle='#e8eef3'; g.font=`${13*k}px "Microsoft YaHei",sans-serif`;
  g.fillText(`织鉴 · 产线规划草图 · ${today()} · 设备 ${S.mach.length} 台 · ${issues.length?issues.length+' 处待处理':'无冲突'}`,14*k,c.height-15*k);
  download(`产线规划_${today()}.png`,c.toDataURL('image/png')); };
$('bSubmit').onclick=()=>toast(`（示意）把方案和 ${S.mach.length} 台设备清单一起提交给销售，这里弹出联系表单`);
$('bHelp').onclick=()=>{ showTab('props'); select(null); $('props').innerHTML=`<p class="ttl">使用说明</p><ol style="padding-left:18px;font-size:13px;line-height:1.75;margin:8px 0">
  <li><b>画厂房</b>：左侧「画厂房」，点出墙角或直接生成矩形；输入层高。</li>
  <li><b>标出现场</b>：用「门」「承重柱」「障碍物」「通道」把门口、柱子、配电柜、楼梯、悬空风管、叉车通道画上。</li>
  <li><b>摆设备</b>：从「设备库」把设备拖进厂房。<kbd>R</kbd> 旋转，靠近别的设备会自动贴边对齐，按住 Shift 不吸附。</li>
  <li><b>看检查</b>：重叠、超界、超高会标红；挡门、占通道、操作区不够会标橙。</li>
  <li><b>保存</b>：「保存方案」下载文件，「导出图片」出一张平面图。浏览器也会自动记住上次的布置。</li></ol>
  <p class="empty">设备外形和尺寸为示意，正式方案以现场测量和设备图纸为准。</p>`; };

// ================================================================
// 设备库卡片 + 缩略图
// ================================================================
$('lib').innerHTML=LIB.map((it,i)=>{ const [L,D]=CAT[it.t].size(it.o); return `<div class="card-m" data-i="${i}" title="拖到厂房里，或点一下再点画布">${it.bd?`<span class="bd">${it.bd}</span>`:''}<canvas width="320" height="220"></canvas><b>${it.name}</b><small>${it.sub?it.sub+' · ':''}${(L/1000).toFixed(1)}×${(D/1000).toFixed(1)} m</small></div>`; }).join('');
$('lib').addEventListener('pointerdown',e=>{ const c=e.target.closest('.card-m'); if(!c) return; e.preventDefault(); const it=LIB[+c.dataset.i];
  if(placing&&placing.item===it){ stopPlacing(); return; } startPlacing(it); placing.dragging=true; });
(function thumbs(){
  SHADOWS=false;
  const tr=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}); tr.setSize(320,220,false); tr.outputEncoding=T.sRGBEncoding; tr.setClearColor(0x000000,0);
  const ts=new T.Scene(); ts.add(new T.HemisphereLight(0xffffff,0x8a96a3,.9)); const dl=new T.DirectionalLight(0xffffff,.8); dl.position.set(1,2,1.5); ts.add(dl);
  const tc=new T.PerspectiveCamera(30,320/220,10,100000);
  document.querySelectorAll('.card-m').forEach(card=>{ const it=LIB[+card.dataset.i], m=CAT[it.t].build(it.o); ts.add(m);
    const [L,D,H]=CAT[it.t].size(it.o), R=Math.max(L,D,H)*1.55; tc.position.set(R*.62,R*.5+H*.2,R*.8); tc.lookAt(0,H*.4,0);
    tr.render(ts,tc); card.querySelector('canvas').getContext('2d').drawImage(tr.domElement,0,0); ts.remove(m); disposeTree(m); });
  tr.dispose(); SHADOWS=true;
})();
function renderSum(){
  const cnt={}; S.mach.forEach(m=>{ cnt[m.name]=(cnt[m.name]||0)+1; });
  const rows=Object.entries(cnt);
  $('sum').innerHTML=rows.length?rows.map(([n,c])=>`<li><span>${n}</span><b>× ${c}</b></li>`).join('')+`<li class="tot"><span>合计</span><b>${S.mach.length} 台</b></li>`:'<li class="empty" style="border:0">还没有摆放设备</li>';
}

// ================================================================
// 渲染循环 + 启动
// ================================================================
function fitClip(){ if(view!=='3d') return; const d=persp.position.distanceTo(ctlP.target), near=Math.max(100,d/150), far=Math.max(200000,d*20);
  if(Math.abs(near-persp.near)/persp.near>.08||persp.far!==far){ persp.near=near; persp.far=far; persp.updateProjectionMatrix(); } }
function loop(){ ctl().update(); fitClip(); renderer.render(scene,cam()); placeLabels(); requestAnimationFrame(loop); }
const root=document.documentElement;
try{ const t=localStorage.getItem('zj-theme'); if(t) root.dataset.theme=t; }catch(e){}
$('themeBtn').onclick=()=>{ const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark'; try{ localStorage.setItem('zj-theme',root.dataset.theme); }catch(e){} applyTheme(); };
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);

applyTheme(); resize();
view=QS.get('view')==='plan'?'plan':'3d';
setTool(QS.get('tool')||'select');
commit(); fitView(); setView(view);
if(QS.get('sel')==='first'&&S.mach[0]) select({k:'m',id:S.mach[0].id});
if(QS.get('tab')) showTab(QS.get('tab'));
requestAnimationFrame(loop);

// 自测：?selftest 时用合成指针事件走一遍主要操作，结果写到 body[data-selftest]
if(QS.has('selftest')) setTimeout(()=>{
  const out=[], ok=(name,cond,info)=>out.push((cond?'PASS ':'FAIL ')+name+(info?' '+info:''));
  const px=(x,z)=>{ ctl().update(); cam().updateMatrixWorld(); const v=new T.Vector3(x,0,z).project(cam()), r=canvas.getBoundingClientRect(); return [r.left+(v.x+1)/2*r.width, r.top+(1-v.y)/2*r.height]; };
  const ev=(type,x,z,target)=>{ const [cx,cy]=px(x,z); (target||canvas).dispatchEvent(new PointerEvent(type,{clientX:cx,clientY:cy,button:0,pointerId:7,bubbles:true})); };
  const key=k=>document.dispatchEvent(new KeyboardEvent('keydown',{key:k}));
  const click=(x,z)=>{ ev('pointerdown',x,z); ev('pointerup',x,z); };
  try{
    setView('plan'); fitView();
    // 1 从设备库拖入
    const n0=S.mach.length, card=document.querySelector('.card-m[data-i="4"]');
    const r=card.getBoundingClientRect(); card.dispatchEvent(new PointerEvent('pointerdown',{clientX:r.left+20,clientY:r.top+20,button:0,pointerId:7,bubbles:true}));
    ev('pointermove',33000,19000); ev('pointerup',33000,19000);
    const m=S.mach[S.mach.length-1];
    ok('拖入设备',S.mach.length===n0+1&&Math.abs(m.x-33000)<300&&Math.abs(m.z-19000)<300,'n='+S.mach.length+' x='+m.x+' z='+m.z);
    // 2 拖动
    const x0=m.x; ev('pointerdown',m.x,m.z); ev('pointermove',m.x-2000,m.z); ev('pointerup',m.x-2000,m.z);
    const m1=S.mach.find(q=>q.id===m.id);
    ok('拖动设备',Math.abs(m1.x-(x0-2000))<300,'x='+m1.x);
    // 3 旋转 + 撤销
    key('r'); ok('R 旋转',S.mach.find(q=>q.id===m.id).rot===90);
    undo(); ok('撤销旋转',S.mach.find(q=>q.id===m.id).rot===0); undo(); undo(); ok('撤销到放置前',S.mach.length===n0,'n='+S.mach.length);
    // 4 画厂房
    S=emptyState(); commit(); setTool('wall');
    click(0,0); click(20000,0); click(20000,12000); click(0,12000); click(0,0);
    ok('画厂房闭合',S.room.closed&&S.room.pts.length===4,JSON.stringify(S.room.pts));
    // 键入长度
    S=emptyState(); commit(); setTool('wall'); click(0,0); ev('pointermove',5000,0);
    for(const k of '12.5') key(k); key('Enter');
    ok('键入长度',!!draft&&draft.pts.length===2&&draft.pts[1][0]===12500,draft&&JSON.stringify(draft.pts));
    key('Escape');
    S.room={pts:[[0,0],[20000,0],[20000,12000],[0,12000]],closed:true,h:6000,t:240}; commit(); fitView();
    // 5 门 / 柱 / 障碍物 / 通道
    setTool('door'); ev('pointermove',10000,11950); click(10000,11950); ok('放门',S.doors.length===1,S.doors[0]&&('seg='+S.doors[0].seg+' off='+Math.round(S.doors[0].off)));
    setTool('col'); click(6000,6000); ok('放柱',S.cols.length===1&&S.cols[0].x===6000);
    setTool('obs'); ev('pointerdown',15000,2000); ev('pointermove',17000,4000); ev('pointerup',17000,4000); ok('画障碍物',S.obs.length===1&&S.obs[0].w===2000);
    setTool('aisle'); ev('pointerdown',1000,2000); ev('pointermove',3000,10000); ev('pointerup',3000,10000); ok('画通道',S.aisles.length===1);
    // 6 检查：压柱子、挡门、出界
    setTool('select');
    S.mach=[{id:'a',t:'pack',name:'包装机',x:6000,z:6000,rot:0,o:{}},{id:'b',t:'conv',name:'输送带',x:10000,z:11000,rot:0,o:{len:3000,h:800,push:false}},{id:'c',t:'cart',name:'布框',x:19900,z:3000,rot:0,o:{}}]; commit();
    const has=(id,re)=>issues.some(i=>i.ref.id===id&&re.test(i.msg));
    ok('检查-压柱',has('a',/承重柱/)); ok('检查-挡门',has('b',/挡住了/)); ok('检查-出界',has('c',/超出/));
    // 7 拖动墙角
    select({k:'room'}); const v=S.room.pts[1]; ev('pointerdown',v[0],v[1]); ev('pointermove',22000,0); ev('pointerup',22000,0);
    ok('拖墙角',S.room.pts[1][0]===22000,JSON.stringify(S.room.pts[1]));
  }catch(err){ out.push('ERROR '+err.message+' '+String(err.stack||'').split('\n')[1]); }
  document.body.dataset.selftest=out.join(' | ');
},800);
})();
</script>
